<!doctype html>
<html lang="en" style="background-color: #000000">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#000000" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta
			name="description"
			content="HearMeOut — swipe right on your next favourite song. Discover music by genre, preview it instantly, and export the keepers straight to Spotify."
		/>
		<!-- Album art and category images come from these two CDNs on nearly every
		     page (Spotify covers on discover, Unsplash fallbacks on categories) —
		     warming up the connection ahead of the actual <img> tag shaves a
		     DNS+TLS round trip off the LCP image on each of those pages. -->
		<!-- No crossorigin attribute: our <img> tags fetch these without CORS, so
		     a crossorigin preconnect would open a connection the browser can't
		     actually reuse for the real request. -->
		<link rel="preconnect" href="https://i.scdn.co" />
		<link rel="preconnect" href="https://images.unsplash.com" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
